[project]
name = "leeway"
version = "0.1.0"
description = "Spacecraft contingency-plan operations — cuts round trips between operators and spacecraft."
requires-python = ">=3.12"
dependencies = [
    "click>=8",
    "httpx>=0.28.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "skyfield>=1.55",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "hatchling>=1.33.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
leeway = "leeway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leeway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
